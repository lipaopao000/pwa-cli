[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa-cli"
version = "0.2.0"
description = "一个现代化的命令行工具，用于辅助学术论文写作"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "lipaopao000", email = "lipaopao000@users.noreply.github.com"}
]
maintainers = [
    {name = "lipaopao000", email = "lipaopao000@users.noreply.github.com"}
]
keywords = [
    "academic",
    "paper",
    "writing",
    "assistant",
    "cli",
    "reference-management",
    "citation",
    "zotero"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "pyyaml>=6.0,<7.0",
    "requests>=2.28.0,<3.0",
    "bibtexparser>=1.4.0,<2.0",
    "openai>=1.0.0,<2.0",
    "InquirerPy>=0.3.4,<1.0",
    "langchain>=0.1.0,<0.3",
    "langchain-core>=0.1.0,<0.3",
    "langchain-openai>=0.0.5,<0.2",
    "langgraph>=0.0.20,<0.3",
    "langsmith>=0.0.70,<0.2",
    "pydantic>=2.0.0,<3.0",
]

[project.optional-dependencies]
async = [
    "aiohttp>=3.8.0,<4.0",
]
progress = [
    "tqdm>=4.65.0,<5.0",
]
rich = [
    "rich>=13.0.0,<14.0",
]
dev = [
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<6.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "black>=23.0.0,<25.0",
    "isort>=5.12.0,<6.0",
    "flake8>=6.0.0,<8.0",
    "mypy>=1.0.0,<2.0",
    "types-pyyaml",
    "types-requests",
]
docs = [
    "sphinx>=7.0.0,<8.0",
    "sphinx-rtd-theme>=1.3.0,<3.0",
    "sphinx-autodoc-typehints>=1.24.0,<3.0",
]
all = [
    "pwa-cli[async,progress,rich,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/lipaopao000/pwa-cli"
Documentation = "https://github.com/lipaopao000/pwa-cli/blob/main/README.md"
Repository = "https://github.com/lipaopao000/pwa-cli"
Issues = "https://github.com/lipaopao000/pwa-cli/issues"
Changelog = "https://github.com/lipaopao000/pwa-cli/releases"

[project.scripts]
pwa = "pwa.cli:main"

[tool.setuptools]
packages = ["pwa"]

[tool.setuptools.package-data]
pwa = ["py.typed"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["pwa"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=pwa",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# coverage configuration
[tool.coverage.run]
source = ["pwa"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "bibtexparser.*",
    "InquirerPy.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langgraph.*",
    "langsmith.*",
]
ignore_missing_imports = true
